     Mouse wheel e smooth scroll. Mobile / touch e native scroll.

<script>
document.addEventListener("DOMContentLoaded", () => {
  if (!window.gsap) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (matchMedia("(pointer: coarse)").matches) return; // mobile e native scroll

  const html = document.documentElement;
  html.style.scrollBehavior = "auto";

  const SPEED = 1;       // wheel e koto dur jabe
  const DURATION = 1.1;  // beshi = aro smooth
  const pos = { y: window.scrollY };
  let target = window.scrollY;
  let animating = false;

  const maxScroll = () => html.scrollHeight - window.innerHeight;
  const stop = () => { gsap.killTweensOf(pos); animating = false; };

  window.addEventListener("wheel", (e) => {
    if (e.ctrlKey || e.defaultPrevented) return;
    if (e.target.closest && e.target.closest("[data-native-scroll]")) return;
    e.preventDefault();

    let d = e.deltaY;
    if (e.deltaMode === 1) d *= 16;
    else if (e.deltaMode === 2) d *= window.innerHeight;

    if (!animating) pos.y = target = window.scrollY;
    target = gsap.utils.clamp(0, maxScroll(), target + d * SPEED);
    animating = true;

    gsap.to(pos, {
      y: target,
      duration: DURATION,
      ease: "power3.out",
      overwrite: true,
      onUpdate: () => window.scrollTo(0, pos.y),
      onComplete: () => { animating = false; }
    });
  }, { passive: false });

  window.addEventListener("mousedown", stop);
  window.addEventListener("keydown", stop);
  document.addEventListener("click", (e) => {
    if (e.target.closest && e.target.closest('a[href*="#"]')) stop();
  });
  window.addEventListener("scroll", () => {
    if (!animating) pos.y = target = window.scrollY;
  }, { passive: true });
});

<!-- ==========================================================
     2. STATS COUNTER (GSAP)
     Kivabe use korben: number text element e attribute din
       data-counter            (value faka rakhun)
     Optional:
       data-counter-duration="2"   (koto second e count hobe)
     Text jemon ache (250+, 10K+, 4.9/5, $1,200) shetai final value.
     Designer e text change korlei counter nije update hobe.
     ========================================================== -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const counters = document.querySelectorAll("[data-counter]");
  if (!counters.length || !window.gsap) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const hasST = !!window.ScrollTrigger;
  if (hasST) gsap.registerPlugin(ScrollTrigger);

  counters.forEach((el) => {
    const original = el.textContent.trim();
    // prefix + number + suffix  (jemon: "$" + "1,200" + "+")
    const match = original.match(/^(\D*)([\d,]*\.?\d+)(.*)$/);
    if (!match) return;

    const prefix = match[1];
    const numText = match[2];
    const suffix = match[3];
    const end = parseFloat(numText.replace(/,/g, ""));
    const useComma = numText.includes(",");
    const duration = parseFloat(el.getAttribute("data-counter-duration")) || 2;

    // choto K / M number (1K+, 5M) count er shomoy 1 decimal dekhabe
    let decimals = (numText.split(".")[1] || "").length;
    if (!decimals && end < 10 && /^[kKmMbB]/.test(suffix)) decimals = 1;

    const format = (v) => {
      const n = useComma
        ? v.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals })
        : v.toFixed(decimals);
      return prefix + n + suffix;
    };

    const state = { val: 0 };
    el.textContent = format(0);

    const run = () => gsap.to(state, {
      val: end,
      duration: duration,
      ease: "power2.out",
      onUpdate: () => { el.textContent = format(state.val); },
      onComplete: () => { el.textContent = original; } // sheshe ashol text
    });

    if (hasST) {
      // element viewport er 85% e ashle ekbar count hobe
      ScrollTrigger.create({ trigger: el, start: "top 85%", once: true, onEnter: run });
    } else {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) { run(); io.disconnect(); }
        });
      }, { threshold: 0.4 });
      io.observe(el);
    }
  });
});
